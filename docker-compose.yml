services:
  go-app:
    container_name: go-app
    image: bookshelfapi
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - go_db
  go_db:
    container_name: go_db
    image: postgres:12
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"

volumes:
  pgdata: {}
